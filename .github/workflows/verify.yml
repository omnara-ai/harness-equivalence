name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  harness-equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-opencode-first-request
          path: experiments/pi-opencode-first-request/artifacts/
          if-no-files-found: ignore
